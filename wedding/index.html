<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ───────── Токены ───────── */
:root {
  --paper:   #F5F5F1;   /* холодная кость */
  --paper-2: #ECEEE8;   /* второй тон для чередования секций */
  --ink:     #1E2622;   /* чёрно-зелёный */
  --muted:   #5C6761;   /* второстепенный текст, 5.2:1 на --paper */
  --line:    rgba(30, 38, 34, .2);
  --accent:  #2F4A3E;   /* хвоя: фокус и точки на нити */
  --on-photo: #F7F7F3;

  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans:  "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --gutter: 20px;
  --max: 1080px;
  --section: clamp(80px, 18vw, 168px);
  --ease: cubic-bezier(.2, .7, .15, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1.0625rem/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: clip;
}
img { display: block; max-width: 100%; }
h1, h2, h3, p, ol, ul, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.wrap { width: 100%; max-width: var(--max); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: var(--section); }
.alt { background: var(--paper-2); }

/* ───────── Типографика ───────── */
.eyebrow {
  display: flex; align-items: center; gap: 14px;
  font: 500 .75rem/1 var(--sans);
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--muted);
}
.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.h2 {
  font: 300 clamp(2.4rem, 10.5vw, 4.6rem)/1 var(--serif);
  letter-spacing: -.01em;
  text-wrap: balance;
}
.h2 em, .greeting em { font-style: italic; font-weight: 300; }
.sec-head { display: grid; gap: 22px; margin-bottom: clamp(40px, 9vw, 80px); }

.lead { font-size: 1.125rem; color: var(--muted); max-width: 34rem; text-wrap: pretty; }

/* ───────── Кнопки ───────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .9em;
  min-height: 54px; padding: 0 30px;
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  font: 500 .8rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
  text-decoration: none; cursor: pointer;
  transition: transform .35s var(--ease), opacity .35s;
}
.btn .arr { display: inline-block; transition: transform .35s var(--ease); }
.btn:hover { transform: translateY(-2px); }
.btn:hover .arr { transform: translateX(5px); }
.btn:active { transform: translateY(0); opacity: .85; }
.btn--solid { background: var(--ink); color: var(--paper); }
.btn--solid:hover { opacity: .92; }
.btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; }
.textlink {
  font: 500 .8rem/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase;
  text-underline-offset: 5px; text-decoration-thickness: 1px; padding-block: 12px;
}

/* ───────── Hero ───────── */
.hero {
  position: relative; isolation: isolate;
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(28px + env(safe-area-inset-top)) var(--gutter) calc(28px + env(safe-area-inset-bottom));
  background: #2A342F; color: var(--on-photo);
}
.hero__img {
  position: absolute; inset: 0; z-index: -2;
  width: 100%; height: 100%; object-fit: cover; object-position: center 28%;
}
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(to top, rgba(18, 24, 21, .78) 0%, rgba(18, 24, 21, .25) 52%, rgba(18, 24, 21, .38) 100%);
}
.hero .eyebrow { color: var(--on-photo); opacity: .92; }
.hero .eyebrow::after { background: rgba(247, 247, 243, .45); }
.hero > .eyebrow, .hero__bottom { width: 100%; max-width: var(--max); margin-inline: auto; }

.names {
  font: 300 clamp(3rem, 15vw, 10.5rem)/.98 var(--serif);
  letter-spacing: -.015em; margin-bottom: clamp(28px, 6vw, 56px);
}
.names .line { display: block; overflow: hidden; padding-block: .06em; }
.names .line > span {
  display: inline-block; transform: translateY(110%);
  animation: rise 1.2s var(--ease) .25s forwards;
}
.names .line--bride { padding-left: .5em; }
@media (min-width: 760px) { .names .line--bride { padding-left: .9em; } }
.names .line--bride > span { animation-delay: .45s; }
.names .amp { font-style: italic; font-weight: 300; opacity: .85; margin-right: .12em; }
@keyframes rise { to { transform: none; } }

.hero__meta {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px;
  padding-top: 18px; border-top: 1px solid rgba(247, 247, 243, .45);
  opacity: 0; animation: fade 1.2s ease 1.1s forwards;
}
.hero__date { font: 400 clamp(1.5rem, 6vw, 2.2rem)/1.2 var(--serif); }
.hero__where { font: 400 .95rem/1.4 var(--sans); letter-spacing: .04em; opacity: .9; }
@keyframes fade { to { opacity: 1; } }

/* ───────── Приветствие ───────── */
.intro { text-align: center; }
.intro .lead { margin: 28px auto 0; }
.greeting { font: 300 clamp(2.4rem, 10vw, 4.2rem)/1.05 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.rule { width: 1px; height: 64px; background: var(--line); margin: 40px auto 0; }

/* ───────── История: нить ───────── */
.thread { position: relative; }
.thread__rail {
  position: absolute; top: 10px; bottom: 0; left: 6px; width: 1px;
  background: var(--line);
}
.thread__fill {
  position: absolute; inset: 0; background: var(--accent);
  transform: scaleY(0); transform-origin: top;
}
.stage { position: relative; padding-left: 38px; margin-bottom: clamp(64px, 14vw, 130px); }
.stage:last-child { margin-bottom: 0; }
.stage__dot {
  position: absolute; left: 0; top: 4px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--ink);
}
.stage__dot::after {
  content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent);
  transform: scale(0); transition: transform .6s var(--ease) .2s;
}
.stage.is-in .stage__dot::after { transform: scale(1); }

.fig { overflow: hidden; background: var(--paper-2); aspect-ratio: 4 / 5; }
.fig img { width: 100%; height: 100%; object-fit: cover; }
.stage__fig { margin-bottom: 26px; }
.stage__year {
  font: 300 clamp(3.2rem, 14vw, 5.5rem)/1 var(--serif);
  letter-spacing: -.02em;
}
.stage__title {
  margin: 10px 0 12px;
  font: 500 .75rem/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
}
.stage__text { max-width: 28rem; }

@media (min-width: 880px) {
  .thread__rail { left: 50%; }
  .stage {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: clamp(48px, 9vw, 120px);
    padding-left: 0; align-items: center;
  }
  .stage__dot { left: 50%; top: 50%; margin: -6px 0 0 -6px; }
  .stage__fig { margin-bottom: 0; }
  .stage:nth-child(even) .stage__fig { order: 2; }
  .stage:nth-child(even) .stage__body { order: 1; text-align: right; }
  .stage:nth-child(even) .stage__text { margin-left: auto; }
}

/* ───────── Отсчёт ───────── */
.count { text-align: center; }
.count .eyebrow { justify-content: center; }
.count .eyebrow::before { content: ""; flex: 1; height: 1px; background: var(--line); }
.clock { display: grid; grid-template-columns: repeat(3, 1fr); margin: clamp(36px, 8vw, 64px) auto; max-width: 760px; }
.clock__cell { padding: 6px 4px; }
.clock__cell + .clock__cell { border-left: 1px solid var(--line); }
.clock__num { display: block; font: 300 clamp(3.4rem, 17vw, 7.5rem)/1 var(--serif); letter-spacing: -.02em; }
.clock__label { display: block; margin-top: 12px; font: 500 .75rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.count__done { font: 300 clamp(2rem, 8vw, 3.4rem)/1.1 var(--serif); margin: 40px 0; }
.count__when { font: 400 1.3rem/1.3 var(--serif); margin-bottom: 30px; }
.count .btn-row { justify-content: center; }

/* ───────── Программа ───────── */
.prog { max-width: 760px; margin-inline: auto; }
.prog__item {
  position: relative; display: grid; grid-template-columns: 46px 1fr; column-gap: 20px;
  padding-bottom: 44px;
}
.prog__item:last-child { padding-bottom: 0; }
.prog__item:not(:last-child)::before {
  content: ""; position: absolute; left: 22px; top: 54px; bottom: 8px; width: 1px; background: var(--line);
}
.prog__icon {
  grid-row: 1 / span 2; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 50%;
  display: grid; place-items: center; background: var(--paper);
}
.prog__icon svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.prog__time { font: 500 .8rem/46px var(--sans); letter-spacing: .2em; color: var(--muted); }
.prog__title { font: 400 clamp(1.6rem, 6.5vw, 2.2rem)/1.1 var(--serif); }
.prog__text { margin-top: 6px; color: var(--muted); max-width: 26rem; }

@media (min-width: 760px) {
  .prog__item { grid-template-columns: 1fr 46px 1fr; column-gap: 36px; }
  .prog__item:not(:last-child)::before { left: 50%; }
  .prog__time { grid-column: 1; grid-row: 1 / span 2; text-align: right; }
  .prog__icon { grid-column: 2; }
  .prog__body { grid-column: 3; grid-row: 1 / span 2; padding-top: 6px; }
}

/* ───────── Место ───────── */
.venue__fig { aspect-ratio: 4 / 3; margin-bottom: 30px; }
.venue__body { display: grid; gap: 14px; }
.venue__name { font: 400 clamp(1.9rem, 7.5vw, 2.8rem)/1.1 var(--serif); }
.venue__addr { color: var(--muted); max-width: 30rem; }
.venue__note { max-width: 30rem; font-size: .98rem; }
.venue .btn-row { margin-top: 14px; }
@media (min-width: 880px) {
  .venue__fig { aspect-ratio: 16 / 8; }
}

/* ───────── Дресс-код ───────── */
.dress { text-align: center; }
.dress .sec-head { justify-items: center; }
.dress .eyebrow { width: 100%; }
.dress .eyebrow::before { content: ""; flex: 1; height: 1px; background: var(--line); }
.dress .lead { margin-inline: auto; }
.swatches {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 26px 8px;
  max-width: 560px; margin: clamp(40px, 8vw, 64px) auto 0;
}
.swatch { text-align: center; }
.swatch__dot {
  display: block; width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%;
  background: var(--c); box-shadow: inset 0 0 0 1px rgba(30, 38, 34, .14);
}
.swatch__name { display: block; font-size: .85rem; line-height: 1.3; color: var(--muted); }
@media (min-width: 760px) {
  .swatches { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .swatch__dot { width: 96px; height: 96px; }
}

/* ───────── Финал ───────── */
.rsvp { text-align: center; padding-bottom: clamp(56px, 12vw, 110px); }
.rsvp .eyebrow { justify-content: center; margin-bottom: 36px; }
.rsvp .eyebrow::before { content: ""; flex: 1; height: 1px; background: var(--line); }
.rsvp__title { font: 300 clamp(2.6rem, 11.5vw, 5.4rem)/1.02 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
.rsvp__title em { font-style: italic; }
.rsvp .lead { margin: 26px auto 38px; }
.rsvp .btn-row { justify-content: center; }
.contact { margin-top: 48px; color: var(--muted); font-size: .98rem; }
.contact a { color: var(--ink); text-underline-offset: 4px; text-decoration-thickness: 1px; padding-block: 6px; display: inline-block; }
.contact span { display: block; }

.foot {
  max-width: var(--max); margin: 0 auto; padding: 28px var(--gutter) calc(36px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px;
  font: 400 .9rem/1.4 var(--sans); color: var(--muted);
}
.foot .nums { letter-spacing: .06em; }

/* Лайнинговые цифры: правило стоит ниже всех `font:`, иначе шорткат его сбросит */
.nums, .nums *, .stage__year { font-variant-numeric: lining-nums tabular-nums; }

/* ───────── Появление при скролле (только transform + opacity) ───────── */
.js [data-reveal] {
  opacity: 0; transform: translateY(26px);
  transition: opacity .95s ease var(--d, 0s), transform 1.1s var(--ease) var(--d, 0s);
}
.js [data-reveal].is-in, .js .is-in [data-reveal] { opacity: 1; transform: none; }
.js .fig img { transform: scale(1.08); transition: transform 1.8s var(--ease); }
.js .is-in .fig img, .js .fig.is-in img { transform: none; }
.js .swatch[data-reveal] { transform: translateY(14px) scale(.9); }
.js .swatch[data-reveal].is-in { transform: none; }

noscript { display: block; padding: 24px var(--gutter); text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .names .line > span { animation: none; transform: none; }
  .hero__meta { animation: none; opacity: 1; }
  .js [data-reveal], .js .fig img, .stage__dot::after, .btn, .btn .arr { transition: none !important; }
  .js [data-reveal] { opacity: 1; transform: none; }
  .js .fig img { transform: none; }
  .stage__dot::after { transform: scale(1); }
}
</style>
</head>

<body>

<header class="hero" id="top">
  <img class="hero__img" src="photo-couple.jpg" width="1200" height="1600" alt="Алексей и Мария" fetchpriority="high" decoding="async">
  <p class="eyebrow">Мы женимся</p>
  <div class="hero__bottom">
    <h1 class="names" id="names"></h1>
    <div class="hero__meta">
      <p class="hero__date nums" id="heroDate"></p>
      <p class="hero__where" id="heroWhere"></p>
    </div>
  </div>
</header>

<main>
  <noscript>Чтобы увидеть приглашение, включите JavaScript в браузере.</noscript>

  <!-- Приветствие -->
  <section class="section intro wrap" aria-labelledby="greeting">
    <h2 class="greeting" id="greeting" data-reveal></h2>
    <p class="lead" id="invitationText" data-reveal style="--d:.12s"></p>
    <div class="rule" data-reveal style="--d:.24s" aria-hidden="true"></div>
  </section>

  <!-- Наша история -->
  <section class="story wrap" style="padding-bottom: var(--section)" aria-labelledby="storyTitle">
    <header class="sec-head" data-reveal>
      <p class="eyebrow">Наша история</p>
      <h2 class="h2" id="storyTitle">С чего всё <em>началось</em></h2>
    </header>
    <div class="thread" id="thread">
      <div class="thread__rail" aria-hidden="true"><div class="thread__fill" id="threadFill"></div></div>
      <ol id="stages"></ol>
    </div>
  </section>

  <!-- Отсчёт -->
  <section class="section alt count" aria-labelledby="countTitle">
    <div class="wrap">
      <p class="eyebrow" data-reveal id="countTitle">До церемонии</p>
      <div id="countBox" data-reveal></div>
      <p class="count__when nums" id="countWhen" data-reveal></p>
      <div class="btn-row" data-reveal>
        <button type="button" class="btn" id="addToCal">Добавить в календарь <span class="arr" aria-hidden="true">→</span></button>
        <a class="textlink" id="gcal" target="_blank" rel="noopener">Google Календарь</a>
      </div>
    </div>
  </section>

  <!-- Программа -->
  <section class="section wrap" aria-labelledby="progTitle">
    <header class="sec-head" data-reveal>
      <p class="eyebrow">Программа дня</p>
      <h2 class="h2" id="progTitle">Как пройдёт <em>наш день</em></h2>
    </header>
    <ol class="prog" id="prog"></ol>
  </section>

  <!-- Место -->
  <section class="section alt venue" aria-labelledby="venueTitle">
    <div class="wrap">
      <header class="sec-head" data-reveal>
        <p class="eyebrow">Место</p>
        <h2 class="h2" id="venueTitle">Куда <em>приехать</em></h2>
      </header>
      <figure class="fig venue__fig" data-reveal>
        <img id="venueImg" src="photo-venue.jpg" width="1400" height="900" alt="Площадка, где пройдёт свадьба" loading="lazy" decoding="async">
      </figure>
      <div class="venue__body" data-reveal>
        <h3 class="venue__name" id="venueName"></h3>
        <p class="venue__addr" id="venueAddr"></p>
        <p class="venue__note" id="venueNote" hidden></p>
        <div class="btn-row">
          <a class="btn" id="mapBtn" target="_blank" rel="noopener">Открыть на карте <span class="arr" aria-hidden="true">→</span></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Дресс-код -->
  <section class="section wrap dress" aria-labelledby="dressTitle">
    <header class="sec-head" data-reveal>
      <p class="eyebrow">Дресс-код</p>
      <h2 class="h2" id="dressTitle">Цвета <em>праздника</em></h2>
      <p class="lead" id="dressText"></p>
    </header>
    <ul class="swatches" id="swatches" aria-label="Палитра праздника"></ul>
  </section>

  <!-- Финал -->
  <section class="section alt rsvp" aria-labelledby="rsvpTitle">
    <div class="wrap">
      <p class="eyebrow" data-reveal>Подтверждение</p>
      <h2 class="rsvp__title" id="rsvpTitle" data-reveal></h2>
      <p class="lead" id="rsvpText" data-reveal style="--d:.1s"></p>
      <div class="btn-row" data-reveal style="--d:.2s">
        <a class="btn btn--solid" id="rsvpBtn" target="_blank" rel="noopener">Подтвердить присутствие <span class="arr" aria-hidden="true">→</span></a>
      </div>
      <p class="contact" id="contact" data-reveal style="--d:.3s"></p>
    </div>
  </section>
</main>

<footer class="foot">
  <span id="footNames"></span>
  <span class="nums" id="footDate"></span>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG — все данные приглашения. Меняйте только здесь.
   Фотографии лежат рядом с index.html; замените файлы с теми же именами
   (или поменяйте имена тут).
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  groom: "Алексей",                                  // [ИМЯ жениха]
  bride: "Мария",                                    // [ИМЯ невесты]

  // Дата и время ЦЕРЕМОНИИ в формате ГГГГ-ММ-ДДTЧЧ:ММ:00+ЧЧ:ММ (смещение часового пояса площадки).
  // Москва — +03:00, Екатеринбург — +05:00, Новосибирск — +07:00.
  ceremonyISO: "2027-06-19T15:00:00+03:00",
  timeZone: "Europe/Moscow",                         // IANA-пояс площадки: гости из других городов увидят местное время площадки
  durationHours: 9,                                  // сколько длится событие в календаре

  // Короткое приглашение под приветствием
  invitationText: "Мы выбрали этот день, чтобы начать общую жизнь, и очень хотим, чтобы вы были рядом. Здесь собрано всё, что нужно знать.",

  // Место
  venue: {
    name: "Загородный клуб «Название»",              // [НАЗВАНИЕ]
    address: "Московская область, д. Пример, ул. Липовая, 12", // [АДРЕС]
    city: "Московская область",                      // коротко, для первого экрана
    mapUrl: "",                                      // [ссылка на Яндекс Карты]. Пусто — кнопка откроет поиск по адресу
    note: "Парковка у входа, трансфер от метро — в 13:30.", // необязательно, можно ""
    photo: "photo-venue.jpg"
  },

  // Наша история (3–4 этапа). year — строка. Тексты-образцы: замените на свои.
  story: [
    { year: "2019", title: "Знакомство",     photo: "photo-story-meeting.jpg",
      text: "Нас познакомили друзья на чужом дне рождения. Мы проговорили весь вечер и забыли, зачем пришли." },
    { year: "2020", title: "Первое свидание", photo: "photo-story-first-date.jpg",
      text: "Прогулка до ночи и кофе в закрытой кофейне: хозяин оставил нам два стакана. С тех пор мы почти не расставались." },
    { year: "2026", title: "Предложение",     photo: "photo-story-proposal.jpg",
      text: "На холме, где мы любим встречать закаты. «Да» прозвучало раньше, чем закончился вопрос." },
    { year: "2027", title: "Свадьба",         photo: "photo-story-wedding.jpg",
      text: "Теперь самое время собрать самых близких. Без вас этот день будет неполным." }
  ],

  // Программа дня. icon: gather | ceremony | banquet | night
  schedule: [
    { time: "14:00", title: "Сбор гостей",  text: "Лимонад, кофе и встреча у входа.",                 icon: "gather" },
    { time: "15:00", title: "Церемония",    text: "Выездная регистрация в саду.",                      icon: "ceremony" },
    { time: "17:00", title: "Банкет",       text: "Ужин, тосты, первый танец и музыка до позднего вечера.", icon: "banquet" },
    { time: "23:00", title: "Завершение",   text: "Прощаемся с гостями.",                              icon: "night" }
  ],

  // Дресс-код: описание + 3–4 цвета палитры
  dressCode: {
    text: "Будем рады, если вы поддержите палитру праздника — от мягких светлых оттенков до глубокого зелёного. Белый и яркие принты, пожалуйста, оставьте за скобками.",
    palette: [
      { name: "Шалфей",         color: "#A9B8A3" },
      { name: "Песок",          color: "#DCCFBC" },
      { name: "Пыльная лазурь", color: "#8FA3B0" },
      { name: "Хвоя",           color: "#2F4A3E" }
    ]
  },

  // Подтверждение присутствия
  rsvp: {
    deadline: "1 мая",                               // [ДАТА] — как показать гостю
    formUrl: "https://forms.gle/XXXXXXXXXXXX"        // [ссылка на Google Форму]
  },

  // Контакт для вопросов. Любое поле можно оставить пустым.
  contact: {
    name: "Анна",                                    // [имя]
    phone: "+7 900 000-00-00",                       // [телефон]
    telegram: "username"                             // [ник в Telegram без @]
  }
};

/* ═══════════════════════════════════════════════════════════════
   Дальше — код. Править не нужно.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Если картинка не нашлась — прячем её, остаётся спокойная заливка
  document.addEventListener('error', (e) => {
    if (e.target && e.target.tagName === 'IMG') e.target.style.visibility = 'hidden';
  }, true);

  /* ── Дата ── */
  const start = new Date(CONFIG.ceremonyISO);
  const end = new Date(start.getTime() + CONFIG.durationHours * 3600e3);
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat('ru-RU', {
      timeZone: CONFIG.timeZone, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(start).map((p) => [p.type, p.value])
  );
  const dateText = `${parts.day} ${parts.month} ${parts.year}`;
  const timeText = `${parts.hour}:${parts.minute}`;
  const dotted = new Intl.DateTimeFormat('ru-RU', { timeZone: CONFIG.timeZone, day: '2-digit', month: '2-digit', year: 'numeric' }).format(start);
  const names = `${CONFIG.groom} и ${CONFIG.bride}`;

  document.title = `${names} — приглашение на свадьбу`;

  /* ── Hero ── */
  $('names').setAttribute('aria-label', names);
  $('names').innerHTML =
    `<span class="line" aria-hidden="true"><span>${esc(CONFIG.groom)}</span></span>` +
    `<span class="line line--bride" aria-hidden="true"><span><i class="amp">&amp;</i>${esc(CONFIG.bride)}</span></span>`;
  $('heroDate').textContent = dateText;
  $('heroWhere').textContent = `${parts.weekday}, ${timeText} · ${CONFIG.venue.city}`;
  $('footNames').textContent = `${CONFIG.groom} & ${CONFIG.bride}`;
  $('footDate').textContent = dotted;

  /* ── Персональное обращение: ?guest=Имя  (&g=m | f | p — необязательно) ── */
  const params = new URLSearchParams(location.search);
  const guest = (params.get('guest') || '').replace(/\s+/g, ' ').trim().slice(0, 60);
  const form = { m: 'Дорогой', f: 'Дорогая', p: 'Дорогие' }[(params.get('g') || '').toLowerCase()] || 'Дорогой(ая)';
  const greetingEl = $('greeting');
  greetingEl.textContent = guest ? `${form} ${guest}!` : 'Дорогие гости!';   // textContent: имя из URL не может внедрить HTML
  $('invitationText').textContent = CONFIG.invitationText;

  /* ── История ── */
  $('stages').innerHTML = CONFIG.story.map((s, i) => `
    <li class="stage" data-watch>
      <span class="stage__dot" aria-hidden="true"></span>
      <figure class="fig stage__fig" data-reveal>
        <img src="${esc(s.photo)}" width="900" height="1125" alt="${esc(s.title)}, ${esc(s.year)}" loading="lazy" decoding="async">
      </figure>
      <div class="stage__body" data-reveal style="--d:.15s">
        <p class="stage__year">${esc(s.year)}</p>
        <h3 class="stage__title">${esc(s.title)}</h3>
        <p class="stage__text">${esc(s.text)}</p>
      </div>
    </li>`).join('');

  /* ── Отсчёт ── */
  const plural = (n, f) => { const m = n % 100, d = n % 10; return m > 10 && m < 20 ? f[2] : d === 1 ? f[0] : d > 1 && d < 5 ? f[1] : f[2]; };
  const UNITS = { d: ['день', 'дня', 'дней'], h: ['час', 'часа', 'часов'], m: ['минута', 'минуты', 'минут'] };
  const countBox = $('countBox');
  countBox.innerHTML = `<div class="clock nums" role="timer">${['d', 'h', 'm'].map((k) =>
    `<div class="clock__cell"><span class="clock__num" data-k="${k}">00</span><span class="clock__label" data-l="${k}"></span></div>`).join('')}</div>`;
  $('countWhen').textContent = `${parts.weekday[0].toUpperCase()}${parts.weekday.slice(1)}, ${dateText}, ${timeText}`;

  function tick() {
    const diff = start.getTime() - Date.now();
    if (diff <= 0) {
      countBox.innerHTML = `<p class="count__done">${diff > -864e5 ? 'Сегодня наш день' : 'Спасибо, что были с нами'}</p>`;
      clearInterval(timer);
      return;
    }
    const v = { d: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5) % 24, m: Math.floor(diff / 6e4) % 60 };
    for (const k of ['d', 'h', 'm']) {
      const num = countBox.querySelector(`[data-k="${k}"]`), label = countBox.querySelector(`[data-l="${k}"]`);
      const txt = String(v[k]).padStart(2, '0');
      if (num.textContent !== txt) num.textContent = txt;
      const lab = plural(v[k], UNITS[k]);
      if (label.textContent !== lab) label.textContent = lab;
    }
  }
  const timer = setInterval(tick, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  tick();

  /* ── Календарь ── */
  const icsDate = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const mapLink = CONFIG.venue.mapUrl || `https://yandex.ru/maps/?text=${encodeURIComponent(CONFIG.venue.address)}`;
  const location_ = `${CONFIG.venue.name}, ${CONFIG.venue.address}`;
  const description = [
    'Программа:',
    ...CONFIG.schedule.map((s) => `${s.time} — ${s.title}`),
    '', `Карта: ${mapLink}`
  ].join('\n');
  const summary = `Свадьба: ${names}`;

  function buildICS() {
    const e = (s) => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
    const fold = (line) => { const out = []; while (line.length > 60) { out.push(line.slice(0, 60)); line = ' ' + line.slice(60); } out.push(line); return out.join('\r\n'); };
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wedding Invitation//RU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:wedding-${icsDate(start)}@invitation`,
      `DTSTAMP:${icsDate(new Date())}`,
      `DTSTART:${icsDate(start)}`,
      `DTEND:${icsDate(end)}`,
      `SUMMARY:${e(summary)}`,
      `LOCATION:${e(location_)}`,
      `DESCRIPTION:${e(description)}`,
      'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:Завтра свадьба', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'
    ].map(fold).join('\r\n') + '\r\n';
  }

  $('addToCal').addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'wedding.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
  $('gcal').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    `&text=${encodeURIComponent(summary)}&dates=${icsDate(start)}/${icsDate(end)}` +
    `&details=${encodeURIComponent(description)}&location=${encodeURIComponent(location_)}`;

  /* ── Программа ── */
  const ICONS = {
    gather:   '<circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
    ceremony: '<circle cx="9" cy="14" r="5.5"/><circle cx="15.5" cy="14" r="5.5"/><path d="M7.2 5.2 9 2.5l1.8 2.7"/>',
    banquet:  '<path d="M6 3h12l-1 6.5a5 5 0 0 1-10 0z"/><path d="M12 14.5V21M8 21h8"/>',
    night:    '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>'
  };
  $('prog').innerHTML = CONFIG.schedule.map((s, i) => `
    <li class="prog__item" data-reveal style="--d:${(i % 2) * .08}s">
      <time class="prog__time nums">${esc(s.time)}</time>
      <span class="prog__icon" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[s.icon] || ICONS.gather}</svg></span>
      <div class="prog__body">
        <h3 class="prog__title">${esc(s.title)}</h3>
        ${s.text ? `<p class="prog__text">${esc(s.text)}</p>` : ''}
      </div>
    </li>`).join('');

  /* ── Место ── */
  $('venueImg').src = CONFIG.venue.photo;
  $('venueName').textContent = CONFIG.venue.name;
  $('venueAddr').textContent = CONFIG.venue.address;
  if (CONFIG.venue.note) { $('venueNote').textContent = CONFIG.venue.note; $('venueNote').hidden = false; }
  $('mapBtn').href = mapLink;

  /* ── Дресс-код ── */
  $('dressText').textContent = CONFIG.dressCode.text;
  $('swatches').innerHTML = CONFIG.dressCode.palette.map((c, i) => `
    <li class="swatch" data-reveal style="--d:${i * .1}s">
      <span class="swatch__dot" style="--c:${esc(c.color)}"></span>
      <span class="swatch__name">${esc(c.name)}</span>
    </li>`).join('');

  /* ── Финал ── */
  $('rsvpTitle').innerHTML = guest ? '' : 'Ждём <em>вас!</em>';
  if (guest) $('rsvpTitle').textContent = `${guest}, ждём вас!`;
  $('rsvpText').textContent = `Нам важно знать, кто будет рядом. Подтвердите присутствие до ${CONFIG.rsvp.deadline} — это займёт минуту.`;
  $('rsvpBtn').href = CONFIG.rsvp.formUrl;

  const c = CONFIG.contact, bits = [];
  if (c.phone) bits.push(`<a href="tel:${esc(c.phone.replace(/[^+\d]/g, ''))}">${esc(c.phone)}</a>`);
  if (c.telegram) bits.push(`<a href="https://t.me/${esc(c.telegram.replace(/^@/, ''))}" target="_blank" rel="noopener">Telegram</a>`);
  if (c.name || bits.length) {
    $('contact').innerHTML = `<span>Остались вопросы?${c.name ? ` Напишите или позвоните: ${esc(c.name)}` : ''}</span>${bits.join(' · ')}`;
  }

  /* ── Появление при скролле и нить истории ── */
  const watched = document.querySelectorAll('[data-reveal], [data-watch]');
  if (reduceMotion || !('IntersectionObserver' in window)) {
    watched.forEach((el) => el.classList.add('is-in'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });
    watched.forEach((el) => io.observe(el));
  }

  const thread = $('thread'), fill = $('threadFill');
  let ticking = false;
  function updateThread() {
    ticking = false;
    const r = thread.getBoundingClientRect();
    const p = reduceMotion ? 1 : clamp((innerHeight * 0.6 - r.top) / r.height, 0, 1);
    fill.style.transform = `scaleY(${p})`;
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(updateThread); } }, { passive: true });
  addEventListener('resize', updateThread);
  updateThread();
})();
</script>
</body>
</html>
